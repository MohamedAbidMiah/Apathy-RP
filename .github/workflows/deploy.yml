name: Apathy SMP

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Config & Run Boot Test
        run: |
          echo "MYSQL_DATABASE=$MYSQL_DATABASE" >> .env
          echo "MYSQL_USER=$MYSQL_USER" >> .env
          echo "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" >> .env
          echo "MYSQL_PASSWORD=$MYSQL_PASSWORD" >> .env

          mkdir -p data/survival/plugins data/survival-2/plugins data/proxy/plugins
          rsync -av --include='plugins/' --include='plugins/**' --exclude='*' configs/survival/ data/survival/
          rsync -av --include='plugins/' --include='plugins/**' --exclude='*' configs/survival/ data/survival-2/
          rsync -av --include='plugins/' --include='plugins/**' --exclude='*' configs/proxy/ data/proxy/

          docker compose config

          docker compose up -d
          echo "Waiting 30 seconds for servers and database to boot..."
          sleep 30

          docker compose ps

          if [ -n "$(docker compose ps --services --filter 'status=exited')" ]; then
            echo "Error: One or more containers crashed during startup!"
            docker compose logs --tail=100
            exit 1
          fi

          echo "Scanning server logs for plugin errors..."
          if docker compose logs mc-survival | grep -qiE "failed to load configuration|disabling.*v[0-9]"; then
            echo "Error: A plugin failed to load or disabled itself during startup!"
            docker compose logs mc-survival | grep -iE "failed|error|disabling"
            exit 1
          fi

          docker compose down

  deploy:
    needs: test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: deploy mc server to production
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/opc/mircs

            git pull origin main

            echo "MYSQL_DATABASE=$MYSQL_DATABASE" >> .env
            echo "MYSQL_USER=$MYSQL_USER" >> .env
            echo "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" >> .env
            echo "MYSQL_PASSWORD=$MYSQL_PASSWORD" >> .env

            mkdir -p data/survival/plugins
            mkdir -p data/survival-2/plugins
            mkdir -p data/proxy/plugins

            rsync -av --include='plugins/' --include='plugins/**' --exclude='*' configs/survival/ data/survival/
            rsync -av --include='plugins/' --include='plugins/**' --exclude='*' configs/survival/ data/survival-2/
            rsync -av --include='plugins/' --include='plugins/**' --exclude='*' configs/proxy/ data/proxy/

            docker compose up -d --force-recreate
